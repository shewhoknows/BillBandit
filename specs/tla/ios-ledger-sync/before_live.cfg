SPECIFICATION Spec
CONSTANTS
  Kind <- KCCE
  MaxPeer = 1
  MaxLoss = 1
  MaxCrash = 1
  AllowSwitch = FALSE
  ReserveAll = FALSE
  HeadOfLine = FALSE
  AccountFence = FALSE
  ReservedGuard = FALSE
INVARIANTS TypeOK NoDoubleApply SucceededApplied
PROPERTIES CacheMonotonic QueueDrains Converges AppliedOrFailed
