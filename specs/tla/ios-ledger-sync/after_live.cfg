\* fixed code, liveness: every queued row ends applied-once or failed; cache converges
\* (no account switch: a signed-out queue is cleared by design and a 401 waits for sign-in)
SPECIFICATION Spec
CONSTANTS
  Kind <- KCCE
  MaxPeer = 1
  MaxLoss = 1
  MaxCrash = 1
  AllowSwitch = FALSE
  ReserveAll = TRUE
  HeadOfLine = TRUE
  AccountFence = TRUE
  ReservedGuard = TRUE
INVARIANTS TypeOK NoDoubleApply SucceededApplied NoCrossAccount NoLostUpdate NoSelfConflict
PROPERTIES CacheMonotonic QueueDrains Converges AppliedOrFailed
