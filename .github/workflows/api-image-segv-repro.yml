name: API image SIGSEGV streak

on:
  pull_request:
    branches: [ci/job-budgets]

permissions:
  contents: read

jobs:
  sequence:
    if: github.head_ref == 'ci/segv-repro'
    name: Thirty consecutive image smoke runs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          persist-credentials: false
      - name: Build the Railway Dockerfile
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/segv-streak"
          context="$RUNNER_TEMP/segv-context"
          mkdir -p "$evidence" "$context"
          git archive "$GITHUB_SHA" | tar -xf - -C "$context"
          docker build --platform linux/amd64 --tag billbandit-api-ci "$context" 2>&1 | tee "$evidence/build.log"
      - uses: ./.github/actions/api-toolchain
      - name: Run the unchanged smoke cases thirty times in sequence
        shell: bash
        run: |
          evidence="$RUNNER_TEMP/segv-streak"
          {
            printf 'image=%s/%s\n' "$ImageOS" "$ImageVersion"
            node --version
            bun --version
            node -p 'require("tsx/package.json").version'
            node -p 'require("@prisma/client/package.json").version'
            free -h
            git rev-parse HEAD
            sha256sum .github/scripts/api-image-smoke.py
          } | tee "$evidence/runtime.txt"
          for index in $(seq -w 1 30); do
            /usr/bin/time -p -o "$evidence/time-$index.txt" python3 .github/scripts/api-image-smoke.py \
              --image billbandit-api-ci --revision "$GITHUB_SHA" --evidence "$evidence/trial-$index"
            printf '%s\tPASS\n' "$index" | tee -a "$evidence/results.tsv"
          done
          test "$(wc -l < "$evidence/results.tsv")" -eq 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: segv-sequential
          path: ${{ runner.temp }}/segv-streak/
          if-no-files-found: error
          retention-days: 7
