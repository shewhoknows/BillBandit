name: API CI

on:
  pull_request:
    branches: [main, 'ci/**']
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: api-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    name: API checks
    runs-on: ${{ vars.BILLBANDIT_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            apps/api
          persist-credentials: false
      - uses: ./.github/actions/api-toolchain
        with:
          seed-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Lint, format and typecheck
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base="$BASE_SHA"
          if ! git cat-file -e "$base^{commit}"; then
            git fetch --no-tags --depth=1 --filter=blob:none origin "$base"
          fi
          python3 .github/scripts/api-check.py "$base" "$GITHUB_SHA"
      - name: Enforce API job budgets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/api-job-budget.py 'API checks' "Lint, format and typecheck"

  build:
    name: API build
    runs-on: ${{ vars.BILLBANDIT_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          sparse-checkout: |
            .github
            apps/api
          persist-credentials: false
      - uses: ./.github/actions/api-toolchain
      - name: Build Next on Bun
        run: timeout 35s bun run build:ci
      - name: Enforce API job budgets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/api-job-budget.py 'API build' "Build Next on Bun"

  e2e:
    name: API E2E (${{ matrix.shard }})
    runs-on: ${{ vars.BILLBANDIT_CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
      TOTAL_SHARDS: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 2
          filter: blob:none
          sparse-checkout: |
            .github
            apps/api
          persist-credentials: false
      - name: Read exact-base timing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TIMING_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          run=$(gh run list --branch main --event push --status success \
            --commit "$TIMING_SHA" --limit 30 --json databaseId,workflowName --jq 'map(select(.workflowName == "API CI")) | .[0].databaseId // empty')
          if [[ -n "$run" ]]; then
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.expired == false and (.name | startswith("api-e2e-")))] | length')
            if [[ "$count" -eq "$TOTAL_SHARDS" ]]; then
              gh run download "$run" --pattern 'api-e2e-*' --dir "$RUNNER_TEMP/e2e-history"
            fi
          fi
      - name: Select E2E scripts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" ]]; then
            if ! git cat-file -e "$BASE_SHA^{commit}"; then
              git fetch --no-tags --depth=1 --filter=blob:none origin "$BASE_SHA"
            fi
            args=(--base "$BASE_SHA")
          fi
          selected=$(python3 -B .github/scripts/api-e2e.py --list "${args[@]}" \
            --shard "$SHARD" --total-shards "$TOTAL_SHARDS" --history "$RUNNER_TEMP/e2e-history")
          printf 'Selected scripts: %s\n' "$selected"
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
      - if: steps.select.outputs.selected != '[]'
        uses: ./.github/actions/api-toolchain
      - name: Run E2E with a disposable database per script
        if: steps.select.outputs.selected != '[]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          args=()
          if [[ -n "$BASE_SHA" ]]; then
            args=(--base "$BASE_SHA")
          fi
          python3 -B .github/scripts/api-e2e.py "${args[@]}" \
            --shard "$SHARD" --total-shards "$TOTAL_SHARDS" --history "$RUNNER_TEMP/e2e-history"
      - name: Upload test evidence
        if: ${{ !cancelled() && steps.select.outputs.selected != '' && steps.select.outputs.selected != '[]' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-e2e-${{ matrix.shard }}
          path: .scratch/ci/api-e2e/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Enforce API job budgets
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/api-job-budget.py 'API E2E (${{ matrix.shard }})' "${{ steps.select.outputs.selected != '[]' && 'Run E2E with a disposable database per script' || 'Select E2E scripts' }}"
