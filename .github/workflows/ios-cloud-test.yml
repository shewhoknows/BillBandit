name: Xcode Cloud Test status

on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  checks: read

concurrency:
  group: ios-cloud-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ vars.BILLBANDIT_IOS_PR_TEST_CHECK != '' && vars.BILLBANDIT_IOS_QUEUE_TEST_CHECK != '' && 'iOS Cloud Test' || 'iOS Cloud Test setup' }}
    if: vars.BILLBANDIT_IOS_PR_TEST_CHECK != '' && vars.BILLBANDIT_IOS_QUEUE_TEST_CHECK != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          filter: blob:none
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Wait for the exact Xcode Cloud Test result
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_SHA: ${{ github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          TEST_CHECK: ${{ github.event_name == 'merge_group' && vars.BILLBANDIT_IOS_QUEUE_TEST_CHECK || vars.BILLBANDIT_IOS_PR_TEST_CHECK }}
        run: python3 .github/scripts/ios-cloud-test.py "$GITHUB_REPOSITORY" "$TEST_SHA" "$TEST_CHECK"
