name: API toolchain
description: Install Bun and restore pinned API dependencies
inputs:
  seed-cache:
    description: Save dependency cache from main
    default: 'false'
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.14'
    - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
      id: dependencies
      with:
        path: node_modules
        key: api-bun-1.3.14-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock', 'apps/api/prisma/schema.prisma') }}
    - if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: |
        bun install --frozen-lockfile --ignore-scripts
        bun run --bun --cwd apps/api db:generate
    - if: inputs.seed-cache == 'true' && steps.dependencies.outputs.cache-hit != 'true'
      uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
      with:
        path: node_modules
        key: ${{ steps.dependencies.outputs.cache-primary-key }}
